version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Minor and patch updates arrive as one PR; majors come one at a time.
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @cloudflare/vitest-pool-workers supports Vitest 4 only (ADR 0003).
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # @types/node follows the lowest Node major in engines.node (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
