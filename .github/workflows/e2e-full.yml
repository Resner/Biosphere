name: E2E full

# The whole E2E suite (`test:e2e:full`) split over parallel runners (ADR 0042), so a run takes about
# a third of the time and no runner starves: the long @slow scenarios get their own runners with one
# worker each. Release calls it before it builds anything; `E2E main` calls it on main so a flaky
# scenario shows up while a milestone is under way, not at its release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every part runs to the end, so one run reports every failure at once.
      fail-fast: false
      matrix:
        include:
          # The other engines (M6c T8, M14 T6, ADR 0077), each installed in its part alone beside the
          # Chromium the mixed pond and the Firefox check launch. Firefox runs `m6c-firefox`,
          # `m6c-flash`, the goldens, the smoke and the mixed pond, headed under Xvfb (headless, it
          # finds no GL driver on the runner); WebKit the goldens and the smoke. One worker each:
          # the mixed pond's duel keeps two browsers inside the referee's deadlines.
          - name: firefox
            args: --project=firefox --workers=1
            engine: firefox
          - name: webkit
            args: --project=webkit --workers=1
            engine: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false # Release calls this workflow: no shared cache in its path
      - run: npm ci
      - run: npm run build
      - run: npm run e2e:setup --if-present
      # `playwright test` starts every hub (about 380 MB each, three dozen of them) before its first
      # test, which is most of a 16 GB runner: since M10 the runner died ("received a shutdown
      # signal") a minute and a half in, as the browsers started. The hubs are idle most of the time,
      # so their pages go to swap for little.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/e2e.swap
          sudo chmod 600 /mnt/e2e.swap
          sudo mkswap /mnt/e2e.swap
          sudo swapon /mnt/e2e.swap
          free -m
      - name: Install ${{ matrix.engine }}
        if: matrix.engine
        run: npx playwright install --with-deps ${{ matrix.engine }} chromium
      - name: Run this part of the suite
        if: ${{ !matrix.engine }}
        run: npx playwright test ${{ matrix.args }}
      - name: Run this part of the suite in Firefox
        if: matrix.engine == 'firefox'
        env:
          E2E_FIREFOX: 1
        run: xvfb-run -a npx playwright test ${{ matrix.args }}
      - name: Run this part of the suite in WebKit
        if: matrix.engine == 'webkit'
        env:
          E2E_WEBKIT: 1
        run: npx playwright test ${{ matrix.args }}
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
