name: CI

on:
  pull_request:
    # Drafts run too: a skipped job counts as a passing `verify`, so a draft skip once let a PR
    # merge untested when a draft-time run cancelled the ready-for-review run (#40).
    types: [opened, synchronize, reopened]
  # Re-check main after dependency changes; this also warms the npm cache that PRs share.
  push:
    branches: [main]
    paths: [package-lock.json]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the single-factory-PR guard lists open PRs

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The single required check. One job, because GitHub rounds every job up to a whole minute.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and its base, for the scope check

      # One factory PR at a time (ADR 0020): a `claude/` PR fails while an open `claude/` PR from this
      # repository has a lower number, so a duplicate claim from a parallel run can never merge.
      # Fork branches are ignored, or anyone could block the factory by naming a branch `claude/…`.
      - name: Single factory PR
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'claude/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          older=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq "
            [.[] | select(.head.repo.full_name == \"$GITHUB_REPOSITORY\"
                          and (.head.ref | startswith(\"claude/\")) and .number < $NUMBER)
                 | \"#\(.number)\"] | join(\" \")")
          if [ -n "$older" ]; then
            echo "::error::Older open factory PR: $older. Only the lowest-numbered open claude/ PR may merge (ADR 0020). Close the duplicate, or close the older one and push again."
            exit 1
          fi

      # Skips build and tests before the toolchain exists and for docs-only PRs.
      # Any error here falls through to a full run.
      - name: Scope
        id: scope
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::No package.json yet; nothing to build or test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] &&
               changed=$(git diff --name-only HEAD^1 HEAD) &&
               ! grep -qvE '^(docs/|\.claude/)|\.md$' <<< "$changed"; then
            echo "::notice::Docs-only change; skipping build and tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        run: npm run check
      - if: steps.scope.outputs.run == 'true'
        run: npm run build
      - if: steps.scope.outputs.run == 'true'
        run: npm run e2e:setup --if-present
      - if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e
