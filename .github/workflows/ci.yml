name: CI

on:
  pull_request:
    # Drafts run too: a skipped job counts as a passing `verify`, so a draft skip once let a PR
    # merge untested when a draft-time run cancelled the ready-for-review run (#40).
    types: [opened, synchronize, reopened]
  # Re-check main after dependency changes; this also warms the npm cache that PRs share.
  push:
    branches: [main]
    paths: [package-lock.json]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the single-factory-PR guard lists open PRs

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The guard, and what this change needs: nothing (docs only), the tests, and which new or changed
  # @slow scenarios must prove themselves.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      slow: ${{ steps.slow.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and its base, for the scope check

      # One factory PR per lane at a time (ADRs 0020, 0044): a `claude/` PR fails while an open
      # `claude/` PR of its lane (`Lane: care` in the body, else build) from this repository has a
      # lower number, so a duplicate claim from a parallel run can never merge. Fork branches are
      # ignored, or anyone could block the factory by naming a branch `claude/…`.
      - name: Single factory PR per lane
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'claude/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")
          older=$(jq -r --arg repo "$GITHUB_REPOSITORY" --argjson n "$NUMBER" '
            def lane: if ((.body // "") | test("(^|\n)Lane: care[ \t\r]*(\n|$)")) then "care" else "build" end;
            (map(select(.number == $n)) | first | lane) as $mine
            | [.[] | select(.head.repo.full_name == $repo and (.head.ref | startswith("claude/"))
                            and .number < $n and lane == $mine) | "#\(.number)"]
            | join(" ")' <<< "$prs")
          if [ -n "$older" ]; then
            echo "::error::Older open factory PR in this lane: $older. Only the lowest-numbered open claude/ PR of a lane may merge (ADRs 0020, 0044). Close the duplicate, or close the older one and push again."
            exit 1
          fi

      # Skips build and tests before the toolchain exists and for docs-only PRs.
      # Any error here falls through to a full run.
      - name: Scope
        id: scope
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::No package.json yet; nothing to build or test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] &&
               changed=$(git diff --name-only HEAD^1 HEAD) &&
               ! grep -qvE '^(docs/|\.claude/)|\.md$' <<< "$changed"; then
            echo "::notice::Docs-only change; skipping build and tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Every new or changed E2E spec runs three times on one worker before it can merge (ADRs 0042,
      # 0044): a flaky scenario would otherwise fail E2E main or a release long after the PR.
      - name: New or changed specs
        id: slow
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'tests/e2e/*.spec.ts' | tr '\n' ' ')
          echo "files=${files% }" >> "$GITHUB_OUTPUT"

  unit:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check

  # The PR's E2E suite (`test:e2e`, no @slow) on parallel runners (ADR 0042): one runner took 9 to
  # 25 minutes, depending on how many workers it could afford (runners now often afford one).
  e2e:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium 1 of 4
            args: --project=chromium --shard=1/4
          - name: chromium 2 of 4
            args: --project=chromium --shard=2/4
          - name: chromium 3 of 4
            args: --project=chromium --shard=3/4
          - name: chromium 4 of 4
            args: --project=chromium --shard=4/4
          - name: social, pond and post
            args: --project=social --project=pond --project=post --no-deps
    env:
      E2E_SKIP_SLOW: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run e2e:setup --if-present
      - name: Run this part of the PR suite
        run: npx playwright test ${{ matrix.args }}
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  slow:
    needs: scope
    if: needs.scope.outputs.slow != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run e2e:setup --if-present
      - name: Repeat the new or changed specs three times
        env:
          FILES: ${{ needs.scope.outputs.slow }}
        run: |
          echo "::notice::Repeating three times: $FILES"
          npx playwright test $FILES --repeat-each=3 --workers=1 --no-deps

  # The single required check. It always runs (a skipped required job counts as passing, #40) and
  # passes only when every part it needed passed.
  verify:
    needs: [scope, unit, e2e, slow]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          SLOW_FILES: ${{ needs.scope.outputs.slow }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          SLOW: ${{ needs.slow.result }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$SCOPE" = success ] || fail "scope or the single-factory-PR guard: $SCOPE"
          if [ "$RUN" != true ]; then
            echo "Nothing to build or test."
            exit 0
          fi
          [ "$UNIT" = success ] || fail "unit (lint, typecheck, unit tests): $UNIT"
          [ "$E2E" = success ] || fail "e2e: $E2E"
          if [ -n "$SLOW_FILES" ]; then
            [ "$SLOW" = success ] || fail "repeated new or changed specs: $SLOW"
          fi
          echo "Every part passed."
