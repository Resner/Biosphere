name: Release

# A merged change to VERSION releases that version: full tests, Pages deploy, tag and GitHub Release.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch: # redeploys main as it is; the release is created only if it's missing

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$version" = 0.0.0 ]; then
            echo "::notice::VERSION is 0.0.0; nothing to release yet."
            exit 0
          fi
          test -f package.json || { echo "::error::No package.json; the toolchain must exist before a release."; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.tag
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false # no shared cache in the publishing path

      - name: Install and run the full test suite
        if: steps.version.outputs.tag
        env:
          BUILD_LABEL: ${{ steps.version.outputs.tag }}
        run: |
          npm ci
          npm run check
          npm run build
          npm run e2e:setup --if-present
          npm run test:e2e:full

      - if: steps.version.outputs.tag
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag and GitHub Release
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists; redeployed without a new release."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
